version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tx_submitter
      POSTGRES_USER: tx_submitter
      POSTGRES_PASSWORD: tx_submitter_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tx_submitter"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
